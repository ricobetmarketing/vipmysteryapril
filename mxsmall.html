<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>DÍA VIP - Gira y Gana</title>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
:root{
  --pink:#ff75e2;
  --bg:#121125;
  --stroke: rgba(255,255,255,.12);
  --text:#f5f7ff;
  --red:#ff4d4d;
  --shadow: 0 22px 60px rgba(0,0,0,.55);

  --card: clamp(96px, 24vw, 150px);
  --card-gap: clamp(8px, 2.8vw, 12px);
  --carousel-h: clamp(130px, 28vw, 180px);
}

*{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
html,body{ height:100%; margin:0; }

body{
  background:
    radial-gradient(900px 520px at 50% -10%, rgba(255,117,226,.18), transparent 60%),
    var(--bg);
  display:flex;
  align-items:center;
  justify-content:center;
  font-family: system-ui, -apple-system, sans-serif;
  color:var(--text);
  padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
}

.shell{
  width:95%;
  max-width:800px;
  border:1px solid var(--stroke);
  border-radius:32px;
  box-shadow:var(--shadow);
  overflow:hidden;
  background:rgba(255,255,255,.04);
}

.header{
  text-align:center;
  padding:24px 15px 10px;
}

.header h1{
  margin:0;
  font-size: clamp(22px, 6vw, 40px);
  background: linear-gradient(180deg, #fff, var(--pink));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.main{ padding:20px; }

.carousel-container{
  position:relative;
  height:var(--carousel-h);
  border-radius:20px;
  background:rgba(0,0,0,.35);
  overflow:hidden;
}

.pointer{
  position:absolute;
  top:0; left:50%;
  transform:translateX(-50%);
  width:0; height:0;
  border-left:15px solid transparent;
  border-right:15px solid transparent;
  border-top:20px solid var(--red);
  z-index:10;
}

.prize-track{
  display:flex;
  align-items:center;
  height:100%;
  transition: transform 4s cubic-bezier(0.12,0,0.08,1);
  will-change: transform;
}

.prize-card{
  min-width:var(--card);
  width:var(--card);
  height:var(--card);
  margin:0 var(--card-gap);
  border-radius:22px;
  overflow:hidden;
  flex-shrink:0;
  background:transparent;
}

.prize-card img{
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:22px;
  user-select:none;
  -webkit-user-drag:none;
}

.controls{
  text-align:center;
  margin-top:20px;
}

#spin-btn{
  padding:15px 50px;
  font-size:18px;
  font-weight:900;
  border:none;
  border-radius:999px;
  cursor:pointer;
  background:var(--pink);
  color:#000;
  box-shadow:0 6px 0 #aa4696;
}

#spin-btn:active{
  transform:translateY(4px);
  box-shadow:0 2px 0 #aa4696;
}

#spin-btn:disabled{
  opacity:.5;
  cursor:not-allowed;
}

#modal-overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  backdrop-filter:blur(5px);
  align-items:center;
  justify-content:center;
  z-index:50;
  padding: 16px;
}

#modal{
  width:90%;
  max-width:350px;
  background:#fff;
  border-radius:24px;
  padding:25px;
  text-align:center;
  color:#111;
  position:relative;
}

.promo-code{
  font-size:20px;
  font-weight:900;
  background:#f0f0f0;
  padding:15px;
  border-radius:12px;
  border:2px dashed #ccc;
  margin:15px 0;
  letter-spacing:.08em;
  word-break: break-word;
}

.copy-btn{
  padding:12px;
  border-radius:10px;
  font-weight:900;
  border:none;
  cursor:pointer;
  width:100%;
  background:var(--pink);
  color:#fff;
}

.toast{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  bottom:-14px;
  background:#111;
  color:#fff;
  padding:8px 12px;
  border-radius:999px;
  font-size:12px;
  font-weight:800;
  opacity:0;
  pointer-events:none;
  transition:opacity .25s ease, bottom .25s ease;
  white-space:nowrap;
}

.toast.show{
  opacity:1;
  bottom:-6px;
}
</style>
</head>

<body>

<div class="shell">
  <div class="header">
    <h1>GIRA Y GANA</h1>
  </div>

  <div class="main">
    <div class="carousel-container">
      <div class="pointer"></div>
      <div class="prize-track" id="track"></div>
    </div>

    <div class="controls">
      <button id="spin-btn" onclick="spinWheel()">GIRAR AHORA</button>
    </div>
  </div>
</div>

<div id="modal-overlay">
  <div id="modal">
    <h2 id="modal-title" style="margin:0">¡FELICIDADES!</h2>
    <div class="promo-code" id="promo-code"></div>
    <button class="copy-btn" id="copy-btn" type="button">COPIAR CÓDIGO</button>
    <div class="toast" id="toast">¡Copiado!</div>
  </div>
</div>

<script>
const FIXED_CODE = "PZWOMF";
const STORAGE_KEY = "vip_spin_locked_mxsmall";
const END_DAY_UTC6 = 16;

const track = document.getElementById("track");
const spinBtn = document.getElementById("spin-btn");
const promoCodeEl = document.getElementById("promo-code");
const modalOverlay = document.getElementById("modal-overlay");
const copyBtn = document.getElementById("copy-btn");
const toast = document.getElementById("toast");
const modalTitle = document.getElementById("modal-title");

let spinning=false;

/* UTC-6 check */
function isVipDayEndedUTC6(){
  const now=new Date();
  const utcMs=now.getTime()+(now.getTimezoneOffset()*60000);
  const utc6Ms=utcMs+(-6*60*60000);
  const d=new Date(utc6Ms);
  return d.getDate()>= END_DAY_UTC6;
}

/* storage */
function getSaved(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(!raw) return null;
    return JSON.parse(raw);
  }catch(e){return null;}
}

function saveLocked(){
  localStorage.setItem(STORAGE_KEY,JSON.stringify({
    code:FIXED_CODE,
    ts:Date.now()
  }));
}

/* UI */
function showModalWithCode(){
  modalTitle.textContent="¡FELICIDADES!";
  promoCodeEl.innerText=FIXED_CODE;
  copyBtn.style.display="block";
  modalOverlay.style.display="flex";
}

function lockUI(){
  spinBtn.disabled=true;
  spinBtn.textContent="YA JUGASTE";
}

function lockEndedUI(){
  spinBtn.disabled=true;
  spinBtn.textContent="DÍA VIP FINALIZADO";

  modalTitle.textContent="🔒 DÍA VIP FINALIZADO";
  promoCodeEl.innerText="El Día VIP ha finalizado. Vuelve el próximo mes.";
  copyBtn.style.display="none";

  modalOverlay.style.display="flex";
}

/* init */
function init(){

  if(isVipDayEndedUTC6()){
    lockEndedUI();
    return;
  }

  const saved=getSaved();
  if(saved){
    lockUI();
    showModalWithCode();
  }
}

/* spin */
function spinWheel(){

  if(isVipDayEndedUTC6()){
    lockEndedUI();
    return;
  }

  const saved=getSaved();
  if(saved){
    lockUI();
    showModalWithCode();
    return;
  }

  if(spinning) return;

  spinning=true;

  setTimeout(()=>{

    confetti({
      particleCount:150,
      spread:70,
      origin:{y:0.6}
    });

    saveLocked();
    showModalWithCode();
    lockUI();

    spinning=false;

  },2000);

}

/* copy */
async function copyCode(){
  try{
    await navigator.clipboard.writeText(FIXED_CODE);
    toast.classList.add("show");
    setTimeout(()=>toast.classList.remove("show"),1000);
  }catch(e){}
}

copyBtn.addEventListener("click",copyCode);

init();
</script>

</body>
</html>
